<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bloomora – Flower Shop &amp; Floral Arrangements</title>
  <meta name="description" content="Sign in to your Bloomora account to manage subscriptions, track orders and save favourite bouquets.">
  <meta name="keywords" content="flower shop login, account sign in, subscription management">
  <meta name="author" content="Bloomora">
  <meta property="og:title" content="Sign In | Bloomora">
  <meta property="og:description" content="Welcome back to Bloomora.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg">
  <script src="assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=3">
  <style>
    .eyebrow::before { display: none; }
  </style>
</head>
<body class="font-body bg-cream text-cocoa-800 dark:bg-cocoa-950 dark:text-cocoa-100">
  <header id="site-header">
    <div class="nav-root">
      <div class="nav-shell">
        <div class="container-x flex items-center justify-end gap-3 py-3.5">
          <button type="button" class="icon-btn" id="theme-toggle" title="Toggle dark / light mode" aria-label="Toggle color theme">
            <i class="fa-solid fa-moon"></i></button>
          <button type="button" class="icon-btn" id="rtl-toggle" title="Toggle RTL / LTR layout" aria-label="Toggle text direction" aria-pressed="false">
            <i class="fa-solid fa-arrow-right-arrow-left"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="section min-h-[70vh] flex items-center">
      <div class="container-x">
        <div class="max-w-md mx-auto">
          <!-- Form card -->
          <div class="card p-8 sm:p-10 flex flex-col justify-center text-center reveal">
            <a href="index.html" dir="ltr" class="flex items-center justify-center mb-5 -translate-x-2" aria-label="Bloomora home">
              <img src="assets/img/logo.svg" alt="Bloomora" class="w-10 h-10">
              <span class="font-display font-semibold text-2xl tracking-tight">Bloomora</span>
            </a>
            <span class="eyebrow justify-center">Welcome back</span>
            <h1 class="section-title text-3xl sm:text-4xl mt-3">Sign in to Bloomora</h1>
            <p class="mt-3 text-sm text-[color:var(--ink-soft)]">Manage subscriptions, track deliveries and save your favourite bouquets.</p>

            <form class="mt-8 space-y-5 text-start" id="login-form" novalidate>
              <div>
                <label class="form-label" for="lg-email">Email address</label>
                <input id="lg-email" class="form-input" type="email" placeholder="you@example.com" required>
              </div>
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="form-label !mb-0" for="lg-pass">Password</label>
                  <a href="#" id="lg-forgot-link" class="text-xs font-bold accent-text hover:underline">Forgot password?</a>
                </div>
                <input id="lg-pass" class="form-input" type="password" placeholder="••••••••" required>
              </div>
              <label class="form-check">
                <input type="checkbox" checked>
                <span>Keep me signed in</span>
              </label>
              <button type="submit" class="btn btn-primary w-full btn-lg">Sign in <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
              <p class="hidden text-sm font-bold text-red-600" id="lg-error"></p>
            </form>

            <div class="flex items-center gap-4 my-6">
              <span class="h-px flex-1 bg-[color:var(--line)]"></span>
              <span class="text-xs font-bold text-[color:var(--ink-soft)]">or continue with</span>
              <span class="h-px flex-1 bg-[color:var(--line)]"></span>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button type="button" class="btn btn-outline" id="google-btn"><i class="fa-brands fa-google"></i> Google</button>
              <button type="button" class="btn btn-outline" id="apple-btn"><i class="fa-brands fa-apple"></i> Apple</button>
            </div>
            <p class="hidden mt-4 text-center text-sm font-bold text-[color:var(--primary-dark)]" id="social-msg"></p>

            <p class="mt-7 text-sm text-center text-[color:var(--ink-soft)]">
              New to Bloomora? <a href="register.html" id="lg-register-link" class="font-bold accent-text hover:underline">Create an account</a>
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="popup-overlay" id="forgot-overlay" aria-hidden="true">
    <div class="popup-card" role="dialog" aria-modal="true" aria-label="Reset password">
      <button type="button" class="popup-close" id="forgot-close" aria-label="Dismiss"><i class="fa-solid fa-xmark"></i></button>
      <span class="pop-icon"><i class="fa-solid fa-key"></i></span>
      <h3 class="font-display text-xl font-semibold mt-4">Reset your password</h3>
      <p class="text-sm text-[color:var(--ink-soft)] mt-1.5">Enter your account email and a new password to sign back in.</p>
      <form class="mt-6 space-y-4 text-start" id="forgot-form" novalidate>
        <div>
          <label class="form-label" for="fg-email">Email address</label>
          <input id="fg-email" class="form-input" type="email" placeholder="you@example.com" required>
        </div>
        <div>
          <label class="form-label" for="fg-pass">New password</label>
          <input id="fg-pass" class="form-input" type="password" placeholder="Min. 8 characters" required>
        </div>
        <div>
          <label class="form-label" for="fg-pass2">Confirm password</label>
          <input id="fg-pass2" class="form-input" type="password" placeholder="Repeat your new password" required>
        </div>
        <p class="hidden text-sm font-bold text-red-600" id="fg-error"></p>
        <button type="submit" class="btn btn-primary w-full">Reset password <i class="fa-solid fa-key"></i></button>
      </form>
    </div>
  </div>

  <button type="button" id="back-to-top" class="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('login-form');
      var err = document.getElementById('lg-error');
      var next = new URLSearchParams(window.location.search).get('next');
      var dest = (next && next.indexOf('://') === -1 && next.charAt(0) !== '/') ? next : 'index.html';
      var regLink = document.getElementById('lg-register-link');
      if (regLink && next) regLink.href = 'register.html?next=' + encodeURIComponent(next);
      if (!form || !window.BloomAuth) return;
      if (window.BloomAuth.current()) { window.location.href = dest; return; }
      function show(msg) { err.textContent = msg; err.classList.remove('hidden'); }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.classList.add('hidden');
        var email = document.getElementById('lg-email').value.trim();
        var pass = document.getElementById('lg-pass').value;
        if (!email || !pass) { show('Please enter your email and password.'); return; }
        var res = window.BloomAuth.login(email, pass);
        if (!res.ok) { show(res.error); return; }
        window.location.href = dest;
      });
      var googleBtn = document.getElementById('google-btn');
      var appleBtn = document.getElementById('apple-btn');
      var socialMsg = document.getElementById('social-msg');
      function notice(text) { socialMsg.textContent = text; socialMsg.classList.remove('hidden'); }
      if (googleBtn) googleBtn.addEventListener('click', function () { notice("Google Sign-In is not configured yet. Add your Client ID in assets/js/auth-config.js to enable sign-in on Bloomora."); });
      if (appleBtn) appleBtn.addEventListener('click', function () { notice("Apple Sign-In is not configured yet. Add your credentials in assets/js/auth-config.js to enable sign-in on Bloomora."); });

      var forgotLink = document.getElementById('lg-forgot-link');
      var overlay = document.getElementById('forgot-overlay');
      var forgotForm = document.getElementById('forgot-form');
      var fgErr = document.getElementById('fg-error');
      var fgEmail = document.getElementById('fg-email');
      var fgPass = document.getElementById('fg-pass');
      var fgPass2 = document.getElementById('fg-pass2');
      function openForgot() { overlay.classList.add('show'); overlay.setAttribute('aria-hidden', 'false'); setTimeout(function () { fgEmail.focus(); }, 120); }
      function closeForgot() { overlay.classList.remove('show'); overlay.setAttribute('aria-hidden', 'true'); }
      if (forgotLink) forgotLink.addEventListener('click', function (e) { e.preventDefault(); openForgot(); });
      if (document.getElementById('forgot-close')) document.getElementById('forgot-close').addEventListener('click', closeForgot);
      if (overlay) overlay.addEventListener('click', function (e) { if (e.target === overlay) closeForgot(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('show')) closeForgot(); });
      if (forgotForm) forgotForm.addEventListener('submit', function (e) {
        e.preventDefault();
        fgErr.classList.add('hidden');
        var email = fgEmail.value.trim();
        var pass = fgPass.value;
        if (!email || !pass) { fgErr.textContent = 'Please enter your email and a new password.'; fgErr.classList.remove('hidden'); return; }
        if (pass !== fgPass2.value) { fgErr.textContent = 'Passwords do not match.'; fgErr.classList.remove('hidden'); return; }
        var res = window.BloomAuth.resetPassword(email, pass);
        if (!res.ok) { fgErr.textContent = res.error; fgErr.classList.remove('hidden'); return; }
        closeForgot();
        document.getElementById('lg-email').value = email;
        document.getElementById('lg-pass').value = '';
        var ok = document.getElementById('lg-error');
        ok.classList.remove('hidden');
        ok.classList.remove('text-red-600');
        ok.classList.add('text-[color:var(--primary-dark)]');
        ok.textContent = 'Password reset. Sign in with your new password.';
      });
    })();
  </script>
  <script src="assets/js/main.js?v=3"></script>
</body>
</html>
