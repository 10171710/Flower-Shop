<body class="font-body bg-cream text-cocoa-800 dark:bg-cocoa-950 dark:text-cocoa-100 min-h-screen">

    <div class="blob w-72 h-72 bg-[#6ab681]/30 top-[-4rem] start-[-4rem]"></div>
